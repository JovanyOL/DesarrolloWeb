   <div class="container mt-5">
    <h2 class="text-center">Alta de Nuevo producto</h2>
    <div class="container py-4">
      <form>
      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-4">
         <div class="form-group">
          <label for="formGroupExampleInput">ID del Producto</label>
            <input type="text" class="form-control" id="navbarNav">
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-4">
          <div class="form-group">
          <label for="formGroupExampleInput">Nombre de Producto</label>
            <input type="text" class="form-control" id="formGroupExampleInput2">
          </div>
         </div>
        <div class="col-sm-12 col-md-12 col-lg-4">
          <div class="form-group">
          <label for="formGroupExampleInput">Categoria</label>
            <input type="text" class="form-control" id="formGroupExampleInput1">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-4">
         <div class="form-group">
          <label for="formGroupExampleInput">Proveedor</label>
            <input type="text" class="form-control" id="formGroupExampleInput1"">
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-4">
          <div class="form-group">
          <label for="formGroupExampleInput">Precio</label>
            <input type="text" class="form-control" id="formGroupExampleInput2">
          </div>
         </div>
        <div class="col-sm-12 col-md-12 col-lg-4">
          <div class="form-group">
          <label for="formGroupExampleInput">Fecha de ingreso</label>
            <input type="text" class="form-control" id="formGroupExampleInput1" placeholder="dd/mm/aaaa">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-4">
          <div class="form-group">
            <label for="exampleFormControlSelect1">Cantidad</label>
              <select class="form-control" id="exampleFormControlSelect1">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
              </select>
          </div> 
        </div>
        <div class="col-sm-12 col-md-6 col-lg-4">
          <div class="form-group">
          <label for="formGroupExampleInput">Comentarios</label>
            <input type="text" class="form-control" id="formGroupExampleInput2">
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-4">
          <label for="formGroupExampleInput">Subir factura </label>
          <div class="custom-file">
            <input type="file" class="custom-file-input" id="customFile">
              <label class="custom-file-label" for="customFile"> </label>
          </div>
        </div>
        <div class="row">
        <div class="container mt-5">
        <!-- Botón con confirmación -->
        <button class="btn btn-success" onclick="confirmarAccion()">Agregar Producto</button>
        </div>
      </div>
      </div>
      </div>
     </form>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>

    <script src="js/bootstrap.min.js"></script>
