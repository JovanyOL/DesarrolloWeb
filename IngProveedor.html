    <!-- Formulario de Alta de Proveedor -->
    <div class="container mt-5">
        <h2 class="text-center">Alta de Nuevo Proveedor</h2>
        <form action="guardar_proveedor.php" method="post">
            <div class="row">
                <!-- ID Proveedor -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="idProveedor">ID Proveedor</label>
                        <input type="text" class="form-control" id="idProveedor" name="idProveedor" placeholder="Ej. 001" required>
                    </div>
                </div>
                <!-- Nombre -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Proveedor ABC" required>
                    </div>
                </div>
                <!-- Correo Electrónico -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="Ej. correo@ejemplo.com" required>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <!-- Domicilio -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="domicilio">Domicilio</label>
                        <input type="text" class="form-control" id="domicilio" name="domicilio" placeholder="Ej. Calle Principal 123" required>
                    </div>
                </div>
                <!-- Teléfono -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej. +123456789" required>
                    </div>
                </div>
                <!-- Fecha de Registro -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="fechaRegistro">Fecha de Registro</label>
                        <input type="date" class="form-control" id="fechaRegistro" name="fechaRegistro" required>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <!-- Localidad -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="localidad">Localidad</label>
                        <select class="form-control" id="localidad" name="localidad" required>
                            <option value="01">Localidad 01</option>
                            <option value="02">Localidad 02</option>
                            <option value="03">Localidad 03</option>
                        </select>
                    </div>
                </div>
                <!-- Código Postal -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="codigoPostal">Código Postal</label>
                        <input type="text" class="form-control" id="codigoPostal" name="codigoPostal" placeholder="Ej. 12345" required>
                    </div>
                </div>
                <!-- Estado -->
                <div class="col-lg-4">
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select class="form-control" id="estado" name="estado" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- Botón para agregar proveedor -->
            <div class="row mt-4">
                <div class="col text-center">
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Agregar Proveedor</button>
                </div>
            </div>
        </form>
    </div>
