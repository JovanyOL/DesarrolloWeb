<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Usuario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Logo InvenTrack" width="30" height="30" class="d-inline-block align-top">
                InvenTrack
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="btn btn-outline-light ms-3" href="index.html"><i class="fas fa-home"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light ms-3" href="ayuda.html"><i class="fas fa-question-circle"></i> Ayuda</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light ms-3" href="inicio_sesion.html"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Registrar Nuevo Usuario</h2>
        <form>
            <h4 class="mb-3">Datos del Usuario</h4>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="nombreUsuario" placeholder="Ejemplo: juan.perez" required>
                </div>
                <div class="col-md-4">
                    <label for="correoElectronico" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correoElectronico" placeholder="Ejemplo: juan.perez@gmail.com" required>
                </div>
                <div class="col-md-4">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="confirmarContrasena" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirmarContrasena" required>
                </div>
                <div class="col-md-4">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select" id="rol" required>
                        <option value="">Selecciona un rol</option>
                        <option value="administrativo">Administrativo</option>
                        <option value="operativo">Operativo</option>
                    </select>
                </div>
            </div>

            <h4 class="mb-3">Datos Personales </h4>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombreCompleto" placeholder="Ejemplo: Juan Pérez Gómez">
                </div>
                <div class="col-md-4">
                    <label for="telefonoContacto" class="form-label">Teléfono de Contacto</label>
                    <input type="text" class="form-control" id="telefonoContacto" placeholder="Ejemplo: +52 55 1234 5678">
                </div>
            </div>

            <div class="row mt-4">
                <div class="col text-center">
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Registrar Usuario</button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
