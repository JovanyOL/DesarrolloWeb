    <div class="container mt-5">
    <h2 class="text-center">Gestión de Inventarios</h2>

    <!-- Botón para agregar nuevo producto -->
    <div class="text-right mb-4">
        <a href="Form.html" class="btn btn-primary">Agregar Nuevo Producto</a>
    </div>

    <!-- Tabla de inventario -->
    <table class="table table-bordered">
        <thead class="thead-light">
            <tr>
                <th>ID</th>
                <th>Nombre del Producto</th>
                <th>Categoría</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Ejemplo de fila de producto -->
            <tr>
                <td>1</td>
                <td>Producto Ejemplo</td>
                <td>Electrónica</td>
                <td>50</td>
                <td>$120.00</td>
                <td>
                    <button class="btn btn-info btn-sm">Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="eliminarProducto(1)">Eliminar</button>
                </td>
            </tr>
            <!-- Las filas de productos pueden ser generadas dinámicamente desde una base de datos -->
        </tbody>
    </table>
</div>

<!-- JavaScript para la función de eliminación (se debe implementar en el backend) -->
<script>
    function eliminarProducto(id) {
        if(confirm("¿Estás seguro de que deseas eliminar este producto?")) {
            // Redirige a un script PHP o llama a una API para eliminar el producto en el backend
            window.location.href = `eliminar_producto.php?id=${id}`;
        }
    }
</script>
